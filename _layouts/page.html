---
layout: default
---
<article class="post" style="min-height: 100vh; display: flex; flex-direction: column;">

  <header class="post-header">
    {%- if page.title -%}
    <h1 class="page-heading">{{ page.title }}</h1>
  {%- endif -%}
  </header>

  <div class="post-content" style="position: relative; width: 100%; flex: 1; margin: 0; padding: 0;">
    <embed
      src="{{ './assets/heidord_resume.pdf' | relative_url }}"
      type="application/pdf"
      width="100%"
      height="100%"
      title="Web PDF Viewer"
    />
  </div>
  <div style="display: relative; justify-content:center">
    <i>Can't view? <a href="{{ './assets/heidord_resume.pdf' | relative_url }}" target="_blank">Download here</a></i>
    <br/>
    <i>Sections removed for privacy</i>
  </div>

</article>
